<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:site_name" content="Arctos Reciprocal Relationship Portal" />
    <meta property="og:type" content="rich" />
    <meta property="og:description" content="Streamlined search portal for querying nested Arctos data and relationships between records." />
    <meta property="og:image" content="https://arctosdb.org/wp-content/uploads/sites/19/2024/06/Arctos_logo_xbg.png" />
    <meta property="og:image:width" content="585" />
    <meta property="og:image:height" content="236" />
    <meta property="og:image:alt" content="Arctos logo" />
    <meta property="twitter:card" content="summary" />
    <meta name="text-scale" content="scale" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {
        /* storage can be blocked; the default theme still applies */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
